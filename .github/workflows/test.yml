name: Tests

on:
  push:
    branches: [ main ]
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: '.python-version'

    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.2

    - name: Install dependencies with uv
      run: |
        uv sync --no-cache

    - name: Run tests with pytest
      run: |
        uv run pytest
